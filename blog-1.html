<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Artikel... - Rookie Joki Blog</title>
    <meta name="description" content="Blog & Tips MLBB dari Rookie Joki.">

    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
	<script src="assets/tailwind.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0066FF',
                            darkblue: '#0052CC',
                            accent: '#FFD100',
                            graybg: '#F4F5F7'
                        }
                    }
                }
            }
        }
    </script>
    <!-- <script src="https://unpkg.com/lucide@latest"></script> -->
	<script src="assets/lucide.min.js"></script>

    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        .prose-blog p { margin-bottom: 0.85rem; }
    </style>

    <!-- CMS Rookie Joki: data, storage, auth (untuk cek status login), render -->
    <script src="assets/cms-config.js"></script>
    <script src="assets/cms-data.js"></script>
    <script src="assets/cms-store.js"></script>
    <script src="assets/cms-auth.js"></script>
    <script src="assets/cms-render.js"></script>
</head>
<body class="bg-slate-200 text-slate-800 font-sans antialiased min-h-screen flex justify-center">

    <div class="w-full max-w-[480px] bg-brand-graybg min-h-screen shadow-xl relative border-x border-slate-300/60">

        <!-- HEADER -->
        <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md shadow-sm border-b border-slate-100">
            <div class="px-4 py-3 flex items-center gap-3">
                <a href="index.html#beranda" aria-label="Kembali ke Beranda"
                   class="w-9 h-9 shrink-0 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-700 transition-colors">
                    <i data-lucide="arrow-left" class="w-4.5 h-4.5"></i>
                </a>
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-8 h-8 shrink-0 rounded-lg bg-brand-blue flex items-center justify-center text-white">
                        <i data-lucide="gamepad-2" class="w-4 h-4"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-xs font-bold leading-none text-slate-900 truncate">Rookie Joki Blog</h1>
                        <p class="text-[9px] text-slate-500 font-medium mt-0.5 truncate">Tips & Berita MLBB</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- ARTIKEL (dirender otomatis via renderBlogDetailPage() dari SITE_DATA.blogPosts) -->
        <main id="blogDetailRoot" class="pb-10">
            <div class="flex flex-col items-center justify-center py-24 text-slate-300">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin mb-2"></i>
                <span class="text-[11px]">Memuat artikel...</span>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', async () => {
            await cmsInitSiteData();
            renderBlogDetailPage(null);
            lucide.createIcons();
        });
    </script>
</body>
</html>
