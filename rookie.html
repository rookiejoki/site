    function getHero() { const d = localStorage.getItem("about_hero"); return d ? JSON.parse(d) : defaultHero; }
    function saveHeroData(d) { localStorage.setItem("about_hero", JSON.stringify(d)); }

    function getIntro() { const d = localStorage.getItem("about_intro"); return d ? JSON.parse(d) : defaultIntro; }
    function saveIntroData(d) { localStorage.setItem("about_intro", JSON.stringify(d)); }

    function getStory() { const d = localStorage.getItem("about_story"); return d ? JSON.parse(d) : defaultStory; }
    function saveStoryData(d) { localStorage.setItem("about_story", JSON.stringify(d)); }

    function getStats() { const d = localStorage.getItem("about_stats"); return d ? JSON.parse(d) : defaultStats; }
    function saveStatsData(d) { localStorage.setItem("about_stats", JSON.stringify(d)); }

    function getFeatures() { const d = localStorage.getItem("about_features"); return d ? JSON.parse(d) : defaultFeatures; }
    function saveFeaturesData(d) { localStorage.setItem("about_features", JSON.stringify(d)); }

    function getVisionMission() { const d = localStorage.getItem("about_vm"); return d ? JSON.parse(d) : defaultVisionMission; }
    function saveVisionMissionData(d) { localStorage.setItem("about_vm", JSON.stringify(d)); }

    function getContact() { const d = localStorage.getItem("about_contact"); return d ? JSON.parse(d) : defaultContact; }
    function saveContactData(d) { localStorage.setItem("about_contact", JSON.stringify(d)); }

    function getSocials() { const d = localStorage.getItem("about_socials"); return d ? JSON.parse(d) : defaultSocials; }
    function saveSocialsData(d) { localStorage.setItem("about_socials", JSON.stringify(d)); }

    // AUTHENTICATION ADMIN (MODAL LOGIN SEPERTI HALAMAN LEADERBOARD)
    function handleAdminToggle() {
      if (isAdmin) {
        isAdmin = false;
        sessionStorage.removeItem("rookie_admin_logged");
        alert("Berhasil keluar dari mode Administrator");
        renderAllSections();
      } else {
        document.getElementById("inputAdminPin").value = "";
        document.getElementById("modalAdminLogin").classList.remove("hidden");
      }
    }

    function submitAdminLogin() {
      const pin = document.getElementById("inputAdminPin").value;
      if (pin === ADMIN_PIN) {
        isAdmin = true;
        sessionStorage.setItem("rookie_admin_logged", "true");
        closeModal("modalAdminLogin");
        renderAllSections();
      } else {
        alert("PIN Admin Salah!");
      }
    }

    function updateAdminUIState() {
      const btnText = document.getElementById("adminStatusText");
      const btn = document.getElementById("btnAdminAccess");
      if (!btnText || !btn) return;

      if (isAdmin) {
        btnText.innerText = "Mode Admin";
        btn.classList.add("bg-emerald-600", "text-white");
      } else {
        btnText.innerText = "Admin";
        btn.classList.remove("bg-emerald-600", "text-white");
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
    }

    // RENDER FUNCTIONS
    function renderHero() {
      const hero = getHero();
      const sec = document.getElementById("section-hero");
      let editBtn = isAdmin ? `<button onclick="openHeroModal()" class="absolute top-3 right-3 bg-amber-500 hover:bg-amber-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg shadow">Edit Hero</button>` : '';

      sec.innerHTML = `
        ${editBtn}
        <div class="w-full max-w-[200px] h-auto mx-auto p-2 bg-white/10 rounded-2xl backdrop-blur-md border border-white/20 shadow-inner">
          <img src="${hero.logo}" alt="Logo Rookie Joki" class="w-full h-auto object-contain drop-shadow" width="600" height="200" onerror="this.src='https://placehold.co/200x80/ffffff/059669?text=Logo+Rookie';">
        </div>
        <div>
          <p class="text-xs text-emerald-100 mt-1">${hero.sub}</p>
        </div>
        <div class="inline-flex items-center gap-1.5 bg-emerald-800/40 border border-emerald-400/30 text-emerald-100 text-[10px] px-3 py-1 rounded-full font-medium">
          <i data-lucide="sparkles" class="w-3 h-3 text-amber-300"></i>
          ${hero.badge}
        </div>
      `;
    }

    function openHeroModal() {
      const hero = getHero();
      document.getElementById("inputHeroLogo").value = hero.logo;
      document.getElementById("inputHeroSub").value = hero.sub;
      document.getElementById("inputHeroBadge").value = hero.badge;
      document.getElementById("modalHero").classList.remove("hidden");
    }

    function saveHero() {
      const logo = document.getElementById("inputHeroLogo").value || "images/Logos.png";
      const sub = document.getElementById("inputHeroSub").value;
      const badge = document.getElementById("inputHeroBadge").value;
      saveHeroData({ logo, sub, badge });
      closeModal("modalHero");
      renderHero();
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function renderIntro() {
      const intro = getIntro();
      const sec = document.getElementById("section-intro");
      let editBtn = isAdmin ? `<button onclick="openIntroModal()" class="text-[10px] bg-amber-500 text-white font-bold px-2 py-0.5 rounded ml-2">Edit</button>` : '';

      sec.innerHTML = `
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-600">${intro.title}</h3>
          ${editBtn}
        </div>
        <p class="text-xs text-gray-600 leading-relaxed">${intro.desc}</p>
      `;
    }

    function openIntroModal() {
      const intro = getIntro();
      document.getElementById("inputIntroTitle").value = intro.title;
      document.getElementById("inputIntroDesc").value = intro.desc;
      document.getElementById("modalIntro").classList.remove("hidden");
    }

    function saveIntro() {
      const title = document.getElementById("inputIntroTitle").value;
      const desc = document.getElementById("inputIntroDesc").value;
      saveIntroData({ title, desc });
      closeModal("modalIntro");
      renderIntro();
    }

    function renderStory() {
      const story = getStory();
      const sec = document.getElementById("section-story");
      let editBtn = isAdmin ? `<button onclick="openStoryModal()" class="text-[10px] bg-amber-500 text-white font-bold px-2 py-0.5 rounded ml-2">Edit</button>` : '';

      sec.innerHTML = `
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-600">${story.title}</h3>
          ${editBtn}
        </div>
        <p class="text-xs text-gray-600 leading-relaxed">${story.p1}</p>
        <p class="text-xs text-gray-600 leading-relaxed">${story.p2}</p>
      `;
    }

    function openStoryModal() {
      const story = getStory();
      document.getElementById("inputStoryTitle").value = story.title;
      document.getElementById("inputStoryP1").value = story.p1;
      document.getElementById("inputStoryP2").value = story.p2;
      document.getElementById("modalStory").classList.remove("hidden");
    }

    function saveStory() {
      const title = document.getElementById("inputStoryTitle").value;
      const p1 = document.getElementById("inputStoryP1").value;
      const p2 = document.getElementById("inputStoryP2").value;
      saveStoryData({ title, p1, p2 });
      closeModal("modalStory");
      renderStory();
    }

    function renderStats() {
      const stats = getStats();
      const sec = document.getElementById("section-stats");
      let editBtn = isAdmin ? `<div class="text-right mb-1"><button onclick="openStatsModal()" class="text-[10px] bg-amber-500 text-white font-bold px-2 py-0.5 rounded">Edit Statistik</button></div>` : '';

      sec.innerHTML = `
        ${editBtn}
        <div class="grid grid-cols-3 gap-2 bg-emerald-50/60 p-3 rounded-2xl border border-emerald-100 text-center">
          <div class="space-y-0.5">
            <span class="text-base font-black text-emerald-600">${stats.match}</span>
            <p class="text-[10px] text-gray-600 font-medium">${stats.matchLabel}</p>
          </div>
          <div class="space-y-0.5 border-x border-emerald-200/60">
            <span class="text-base font-black text-emerald-600">${stats.cust}</span>
            <p class="text-[10px] text-gray-600 font-medium">${stats.custLabel}</p>
          </div>
          <div class="space-y-0.5">
            <span class="text-base font-black text-emerald-600">${stats.win}</span>
            <p class="text-[10px] text-gray-600 font-medium">${stats.winLabel}</p>
          </div>
        </div>
      `;
    }

    function openStatsModal() {
      const stats = getStats();
      document.getElementById("inputStatMatch").value = stats.match;
      document.getElementById("inputStatMatchLabel").value = stats.matchLabel;
      document.getElementById("inputStatCust").value = stats.cust;
      document.getElementById("inputStatCustLabel").value = stats.custLabel;
      document.getElementById("inputStatWin").value = stats.win;
      document.getElementById("inputStatWinLabel").value = stats.winLabel;
      document.getElementById("modalStats").classList.remove("hidden");
    }

    function saveStats() {
      saveStatsData({
        match: document.getElementById("inputStatMatch").value,
        matchLabel: document.getElementById("inputStatMatchLabel").value,
        cust: document.getElementById("inputStatCust").value,
        custLabel: document.getElementById("inputStatCustLabel").value,
        win: document.getElementById("inputStatWin").value,
        winLabel: document.getElementById("inputStatWinLabel").value
      });
      closeModal("modalStats");
      renderStats();
    }

    function renderFeatures() {
      const features = getFeatures();
      const sec = document.getElementById("section-features");
      let addBtn = isAdmin ? `<button onclick="openFeatureModal()" class="text-[10px] bg-emerald-600 text-white font-bold px-2 py-0.5 rounded">Tambah</button>` : '';

      let itemsHtml = "";
      features.forEach(f => {
        let adminBtns = isAdmin ? `
          <div class="flex gap-1 ml-auto">
            <button onclick="openFeatureModal(${f.id})" class="text-[9px] bg-amber-500 text-white px-1.5 py-0.5 rounded">Edit</button>
            <button onclick="deleteFeature(${f.id})" class="text-[9px] bg-red-500 text-white px-1.5 py-0.5 rounded">Hapus</button>
          </div>
        ` : '';

        itemsHtml += `
          <div class="flex items-start gap-3 p-3 bg-gray-50 rounded-xl border border-gray-100">
            <div class="p-2 ${f.color || 'bg-emerald-100 text-emerald-700'} rounded-lg shrink-0">
              <i data-lucide="${f.icon || 'star'}" class="w-4 h-4"></i>
            </div>
            <div class="flex-1">
              <h5 class="text-xs font-bold text-gray-800">${f.title}</h5>
              <p class="text-[11px] text-gray-500 mt-0.5">${f.desc}</p>
            </div>
            ${adminBtns}
          </div>
        `;
      });

      sec.innerHTML = `
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-600">Mengapa Memilih Kami</h3>
          ${addBtn}
        </div>
        <div class="space-y-2.5">${itemsHtml}</div>
      `;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function openFeatureModal(id = null) {
      document.getElementById("inputFeatureId").value = "";
      document.getElementById("inputFeatureTitle").value = "";
      document.getElementById("inputFeatureDesc").value = "";
      document.getElementById("inputFeatureIcon").value = "award";
      document.getElementById("inputFeatureColor").value = "bg-emerald-100 text-emerald-700";

      if (id) {
        const list = getFeatures();
        const f = list.find(item => item.id === id);
        if (f) {
          document.getElementById("titleModalFeature").innerText = "Edit Keunggulan";
          document.getElementById("inputFeatureId").value = f.id;
          document.getElementById("inputFeatureTitle").value = f.title;
          document.getElementById("inputFeatureDesc").value = f.desc;
          document.getElementById("inputFeatureIcon").value = f.icon;
          document.getElementById("inputFeatureColor").value = f.color;
        }
      } else {
        document.getElementById("titleModalFeature").innerText = "Tambah Keunggulan Baru";
      }
      document.getElementById("modalFeature").classList.remove("hidden");
    }

    function saveFeature() {
      const id = document.getElementById("inputFeatureId").value;
      const title = document.getElementById("inputFeatureTitle").value;
      const desc = document.getElementById("inputFeatureDesc").value;
      const icon = document.getElementById("inputFeatureIcon").value || "star";
      const color = document.getElementById("inputFeatureColor").value;

      if (!title) return alert("Judul keunggulan wajib diisi!");

      let list = getFeatures();
      if (id) {
        list = list.map(f => f.id == id ? { ...f, title, desc, icon, color } : f);
      } else {
        list.push({ id: Date.now(), title, desc, icon, color });
      }

      saveFeaturesData(list);
      closeModal("modalFeature");
      renderFeatures();
    }

    function deleteFeature(id) {
      if (confirm("Hapus poin keunggulan ini?")) {
        let list = getFeatures();
        list = list.filter(f => f.id !== id);
        saveFeaturesData(list);
        renderFeatures();
      }
    }

    function renderVisionMission() {
      const vm = getVisionMission();
      const sec = document.getElementById("section-vision-mission");
      let editBtn = isAdmin ? `<button onclick="openVisionMissionModal()" class="text-[10px] bg-amber-500 text-white font-bold px-2 py-0.5 rounded ml-2">Edit</button>` : '';

      let listHtml = vm.missions.map(m => `
        <li class="flex items-start gap-2">
          <span class="text-emerald-400 select-none">•</span>
          <span class="leading-relaxed">${m}</span>
        </li>
      `).join('');

      sec.innerHTML = `
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-600">Visi & Misi</h3>
          ${editBtn}
        </div>
        <div class="bg-gradient-to-r from-gray-900 to-gray-800 text-white p-4 rounded-2xl space-y-3">
          <div class="space-y-1">
            <div class="flex items-center gap-1.5 text-amber-400 font-bold text-xs">
              <i data-lucide="target" class="w-3.5 h-3.5"></i> Visi
            </div>
            <p class="text-xs text-gray-300 leading-relaxed">${vm.vision}</p>
          </div>
          <hr class="border-gray-700">
          <div class="space-y-2">
            <div class="flex items-center gap-1.5 text-emerald-400 font-bold text-xs">
              <i data-lucide="compass" class="w-3.5 h-3.5"></i> Misi
            </div>
            <ul class="text-xs text-gray-300 space-y-0.5 list-none pl-0">${listHtml}</ul>
          </div>
        </div>
      `;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function openVisionMissionModal() {
      const vm = getVisionMission();
      document.getElementById("inputVision").value = vm.vision;
      document.getElementById("inputMissions").value = vm.missions.join('\n');
      document.getElementById("modalVisionMission").classList.remove("hidden");
    }

    function saveVisionMission() {
      const vision = document.getElementById("inputVision").value;
      const missionsRaw = document.getElementById("inputMissions").value;
      const missions = missionsRaw.split('\n').filter(m => m.trim() !== '');

      saveVisionMissionData({ vision, missions });
      closeModal("modalVisionMission");
      renderVisionMission();
    }

    function renderContact() {
      const c = getContact();
      const sec = document.getElementById("section-contact");
      let editBtn = isAdmin ? `<button onclick="openContactModal()" class="text-[10px] bg-amber-500 text-white font-bold px-2 py-0.5 rounded ml-2">Edit</button>` : '';

      sec.innerHTML = `
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-600">Hubungi Kami</h3>
          ${editBtn}
        </div>
        <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100 space-y-2.5 text-xs">
          <div class="flex items-center gap-2.5 text-gray-700">
            <i data-lucide="map-pin" class="w-4 h-4 text-emerald-600 shrink-0"></i>
            <span>${c.address}</span>
          </div>
          <div class="flex items-center gap-2.5 text-gray-700">
            <i data-lucide="mail" class="w-4 h-4 text-emerald-600 shrink-0"></i>
            <span>${c.email}</span>
          </div>
          <div class="flex items-center gap-2.5 text-gray-700">
            <i data-lucide="phone" class="w-4 h-4 text-emerald-600 shrink-0"></i>
            <span>${c.phone}</span>
          </div>
        </div>
      `;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function openContactModal() {
      const c = getContact();
      document.getElementById("inputContactAddress").value = c.address;
      document.getElementById("inputContactEmail").value = c.email;
      document.getElementById("inputContactPhone").value = c.phone;
      document.getElementById("modalContact").classList.remove("hidden");
    }

    function saveContact() {
      saveContactData({
        address: document.getElementById("inputContactAddress").value,
        email: document.getElementById("inputContactEmail").value,
        phone: document.getElementById("inputContactPhone").value
      });
      closeModal("modalContact");
      renderContact();
    }

    // RENDER & CRUD SOSIAL MEDIA FOOTER
    function renderSocials() {
      const socials = getSocials();
      const sec = document.getElementById("section-socials");
      let addBtn = isAdmin ? `<button onclick="openSocialModal()" class="text-[10px] bg-emerald-600 text-white font-bold px-2 py-0.5 rounded shadow">Tambah Sosmed</button>` : '';

      let iconsHtml = "";
      socials.forEach(s => {
        let adminOverlay = isAdmin ? `
          <div class="flex gap-1 mt-1 justify-center">
            <button onclick="openSocialModal(${s.id})" class="text-[8px] bg-amber-500 text-white px-1 rounded">Edit</button>
            <button onclick="deleteSocial(${s.id})" class="text-[8px] bg-red-500 text-white px-1 rounded">Hapus</button>
          </div>
        ` : '';

        iconsHtml += `
          <div class="flex flex-col items-center">
            <a href="${s.url}" target="_blank" class="w-9 h-9 ${s.color || 'bg-gray-200 text-gray-800'} rounded-full flex items-center justify-center transition shadow-2xs" title="${s.title}">
              <i data-lucide="${s.icon || 'link'}" class="w-4.5 h-4.5"></i>
            </a>
            ${adminOverlay}
          </div>
        `;
      });

      sec.innerHTML = `
        <div class="space-y-0.5 flex flex-col items-center">
          <p class="text-[10px] text-gray-500">Temukan kami di:</p>
          ${addBtn}
        </div>
        <div class="flex justify-center items-start gap-3 pt-1 flex-wrap">
          ${iconsHtml}
        </div>
        <p class="text-[9px] text-gray-400 font-medium">© 2021 Rookie Joki. Hak Cipta Dilindungi.</p>
      `;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function openSocialModal(id = null) {
      document.getElementById("inputSocialId").value = "";
      document.getElementById("inputSocialName").value = "";
      document.getElementById("inputSocialUrl").value = "";
      document.getElementById("inputSocialIcon").value = "link";
      document.getElementById("inputSocialColor").value = "bg-emerald-100 text-emerald-600 hover:bg-emerald-600 hover:text-white";

      if (id) {
        const list = getSocials();
        const s = list.find(item => item.id === id);
        if (s) {
          document.getElementById("titleModalSocial").innerText = "Edit Sosial Media";
          document.getElementById("inputSocialId").value = s.id;
          document.getElementById("inputSocialName").value = s.title;
          document.getElementById("inputSocialUrl").value = s.url;
          document.getElementById("inputSocialIcon").value = s.icon;
          document.getElementById("inputSocialColor").value = s.color;
        }
      } else {
        document.getElementById("titleModalSocial").innerText = "Tambah Sosial Media";
      }
      document.getElementById("modalSocial").classList.remove("hidden");
    }

    function saveSocial() {
      const id = document.getElementById("inputSocialId").value;
      const title = document.getElementById("inputSocialName").value;
      const url = document.getElementById("inputSocialUrl").value;
      const icon = document.getElementById("inputSocialIcon").value || "link";
      const color = document.getElementById("inputSocialColor").value;

      if (!title || !url) return alert("Nama platform dan URL wajib diisi!");

      let list = getSocials();
      if (id) {
        list = list.map(s => s.id == id ? { ...s, title, url, icon, color } : s);
      } else {
        list.push({ id: Date.now(), title, url, icon, color });
      }

      saveSocialsData(list);
      closeModal("modalSocial");
      renderSocials();
    }

    function deleteSocial(id) {
      if (confirm("Hapus sosial media ini dari footer?")) {
        let list = getSocials();
        list = list.filter(s => s.id !== id);
        saveSocialsData(list);
        renderSocials();
      }
    }

    function renderAllSections() {
      updateAdminUIState();
      renderHero();
      renderIntro();
      renderStory();
      renderStats();
      renderFeatures();
      renderVisionMission();
      renderContact();
      renderSocials();
    }

    // INIT
    document.addEventListener('DOMContentLoaded', () => {
      renderAllSections();
    });
  </script>
